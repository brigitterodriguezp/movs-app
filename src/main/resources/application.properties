spring.application.name=movs-app-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movs_app_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:dev-only-change-this-secret}
app.security.jwt-ttl-minutes=${APP_SECURITY_JWT_TTL_MINUTES:30}
app.security.login-max-attempts=${APP_SECURITY_LOGIN_MAX_ATTEMPTS:5}
app.security.login-window-minutes=${APP_SECURITY_LOGIN_WINDOW_MINUTES:1}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.error.include-message=never
server.error.include-stacktrace=never
