spring.application.name=movs-app-backend
debug=false
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:movs_app_db}
spring.datasource.username=${DB_USERNAME:brigitte}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=MovsAppPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=15000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:dev-only-change-this-secret}
app.security.jwt-ttl-minutes=${APP_SECURITY_JWT_TTL_MINUTES:30}
app.security.login-max-attempts=${APP_SECURITY_LOGIN_MAX_ATTEMPTS:5}
app.security.login-window-minutes=${APP_SECURITY_LOGIN_WINDOW_MINUTES:1}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}
app.admin.name=${APP_ADMIN_NAME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.com.zaxxer.hikari=INFO
logging.level.com.movsapp.backend=INFO
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
